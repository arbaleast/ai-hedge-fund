name: ai-fund

services:
  ai-fund:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-fund:latest
    container_name: ai-fund
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/history')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
