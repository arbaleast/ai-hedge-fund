[tool.poetry]
name = "ai-fund"
version = "2026.6.9"
description = "AI 基金分析系统 — LangGraph 编排 7 个 agent + new-api LLM"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [
    { include = "src", from = "." },
    { include = "app", from = "." }
]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.4.2"
python-dotenv = "1.0.0"
pandas = "^2.1.0"
numpy = "^1.24.0"
httpx = "^0.27.0"
matplotlib = "^3.9.2"
tabulate = "^0.9.0"
colorama = "^0.4.6"
rich = "^13.9.4"
uvicorn = {extras = ["standard"], version = "^0.30.0" }
fastapi = "^0.104.0"
jinja2 = "^3.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^23.7.0"
isort = "^5.12.0"
flake8 = "^6.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 420
target-version = ['py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
force_alphabetical_sort_within_sections = true

[tool.poetry.scripts]
ai-fund-web = "app.web:app"